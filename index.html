<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes & Ladders</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <h1>🐍 Snakes & Ladders 🪜</h1>
    <p class="subtitle">First player to reach 100 wins!</p>

    <!-- Players -->
    <div class="players">

        <div class="player active" id="player1Card">
            <span class="token red"></span>
            <div>
                <b>Player 1</b>
                <small>Position: <span id="pos1">1</span></small>
            </div>
        </div>

        <div class="player" id="player2Card">
            <span class="token blue"></span>
            <div>
                <b>Player 2</b>
                <small>Position: <span id="pos2">1</span></small>
            </div>
        </div>

    </div>

    <!-- Board -->
    <div id="board" class="board"></div>

    <!-- Controls -->
    <div class="controls">

        <h2 id="turn">Player 1's Turn</h2>

        <div id="dice" class="dice">🎲</div>

        <button id="rollBtn">ROLL DICE</button>

        <button id="resetBtn" class="reset">
            NEW GAME
        </button>

        <p id="message">
            Roll the dice to begin!
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
